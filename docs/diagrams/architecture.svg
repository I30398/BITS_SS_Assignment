<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>FoodExpress microservices architecture - 2025MT03083 / Ajeet Kumar Yadav</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Clients -->
  <rect x="300" y="16" width="360" height="48" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="480" y="38" text-anchor="middle" font-weight="600">Clients</text>
  <text x="480" y="55" text-anchor="middle" fill="#475569" font-size="12">Customer app · Restaurant partner app · Delivery app · Postman</text>

  <!-- Gateway -->
  <rect x="300" y="96" width="360" height="48" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="480" y="118" text-anchor="middle" font-weight="600">API Gateway (K8s Ingress / NGINX)</text>
  <text x="480" y="135" text-anchor="middle" fill="#3730a3" font-size="12">routing · TLS · auth (JWT) · rate limiting</text>
  <line x1="480" y1="64" x2="480" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Cluster boundary -->
  <rect x="16" y="168" width="928" height="416" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="30" y="188" fill="#64748b" font-size="12">Kubernetes cluster · namespace foodexpress</text>

  <!-- gateway fan-out bus -->
  <line x1="480" y1="144" x2="480" y2="200" stroke="#475569" stroke-width="1.5"/>
  <line x1="95" y1="200" x2="865" y2="200" stroke="#475569" stroke-width="1.5"/>
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#a)">
    <line x1="95" y1="200" x2="95" y2="222"/>
    <line x1="249" y1="200" x2="249" y2="222"/>
    <line x1="403" y1="200" x2="403" y2="222"/>
    <line x1="557" y1="200" x2="557" y2="222"/>
    <line x1="711" y1="200" x2="711" y2="222"/>
    <line x1="865" y1="200" x2="865" y2="222"/>
  </g>

  <!-- Services: width 140, centers 95,249,403,557,711,865 -->
  <g>
    <rect x="25" y="224" width="140" height="70" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="95" y="250" text-anchor="middle" font-weight="600">Customer</text>
    <text x="95" y="266" text-anchor="middle" font-weight="600">Service</text>
    <text x="95" y="284" text-anchor="middle" fill="#64748b" font-size="11">profile · addresses</text>

    <rect x="179" y="224" width="140" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="249" y="250" text-anchor="middle" font-weight="600">Restaurant</text>
    <text x="249" y="266" text-anchor="middle" font-weight="600">Service ★</text>
    <text x="249" y="284" text-anchor="middle" fill="#166534" font-size="11">Node.js · :3001</text>

    <rect x="333" y="224" width="140" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="403" y="250" text-anchor="middle" font-weight="600">Order</text>
    <text x="403" y="266" text-anchor="middle" font-weight="600">Service ★</text>
    <text x="403" y="284" text-anchor="middle" fill="#166534" font-size="11">Node.js · :3002</text>

    <rect x="487" y="224" width="140" height="70" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="557" y="250" text-anchor="middle" font-weight="600">Payment</text>
    <text x="557" y="266" text-anchor="middle" font-weight="600">Service</text>
    <text x="557" y="284" text-anchor="middle" fill="#64748b" font-size="11">authorize · refund</text>

    <rect x="641" y="224" width="140" height="70" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="711" y="250" text-anchor="middle" font-weight="600">Delivery</text>
    <text x="711" y="266" text-anchor="middle" font-weight="600">Service</text>
    <text x="711" y="284" text-anchor="middle" fill="#64748b" font-size="11">assign · track agent</text>

    <rect x="795" y="224" width="140" height="70" rx="8" fill="#f8fafc" stroke="#64748b"/>
    <text x="865" y="250" text-anchor="middle" font-weight="600">Notification</text>
    <text x="865" y="266" text-anchor="middle" font-weight="600">Service</text>
    <text x="865" y="284" text-anchor="middle" fill="#64748b" font-size="11">SMS · email · push</text>
  </g>

  <!-- Sync REST: Order -> Restaurant -->
  <path d="M333,259 L321,259" stroke="#15803d" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="236" y="300" width="180" height="34" rx="4" fill="#ffffff" stroke="#15803d"/>
  <text x="326" y="314" text-anchor="middle" fill="#15803d" font-size="11" font-weight="600">sync REST (implemented)</text>
  <text x="326" y="328" text-anchor="middle" fill="#15803d" font-size="11">POST /menu/validate</text>

  <!-- Databases -->
  <g font-size="11">
    <g transform="translate(95,380)">
      <ellipse cx="0" cy="0" rx="48" ry="9" fill="#f1f5f9" stroke="#64748b"/>
      <path d="M-48,0 v30 a48,9 0 0,0 96,0 v-30" fill="#f1f5f9" stroke="#64748b"/>
      <text y="26" text-anchor="middle">customer_db</text>
    </g>
    <g transform="translate(249,380)">
      <ellipse cx="0" cy="0" rx="48" ry="9" fill="#dcfce7" stroke="#16a34a"/>
      <path d="M-48,0 v30 a48,9 0 0,0 96,0 v-30" fill="#dcfce7" stroke="#16a34a"/>
      <text y="26" text-anchor="middle">restaurant_db</text>
    </g>
    <g transform="translate(403,380)">
      <ellipse cx="0" cy="0" rx="48" ry="9" fill="#dcfce7" stroke="#16a34a"/>
      <path d="M-48,0 v30 a48,9 0 0,0 96,0 v-30" fill="#dcfce7" stroke="#16a34a"/>
      <text y="26" text-anchor="middle">order_db</text>
    </g>
    <g transform="translate(557,380)">
      <ellipse cx="0" cy="0" rx="48" ry="9" fill="#f1f5f9" stroke="#64748b"/>
      <path d="M-48,0 v30 a48,9 0 0,0 96,0 v-30" fill="#f1f5f9" stroke="#64748b"/>
      <text y="26" text-anchor="middle">payment_db</text>
    </g>
    <g transform="translate(711,380)">
      <ellipse cx="0" cy="0" rx="48" ry="9" fill="#f1f5f9" stroke="#64748b"/>
      <path d="M-48,0 v30 a48,9 0 0,0 96,0 v-30" fill="#f1f5f9" stroke="#64748b"/>
      <text y="26" text-anchor="middle">delivery_db</text>
    </g>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="95" y1="294" x2="95" y2="370"/>
    <line x1="249" y1="334" x2="249" y2="370"/>
    <line x1="249" y1="294" x2="249" y2="300"/>
    <line x1="403" y1="294" x2="403" y2="300"/>
    <line x1="403" y1="334" x2="403" y2="370"/>
    <line x1="557" y1="294" x2="557" y2="370"/>
    <line x1="711" y1="294" x2="711" y2="370"/>
  </g>
  <text x="480" y="440" text-anchor="middle" fill="#64748b" font-size="11">Database-per-service: PostgreSQL, private to each service (no shared tables)</text>

  <!-- Event bus -->
  <rect x="40" y="470" width="880" height="44" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="480" y="490" text-anchor="middle" font-weight="600" fill="#78350f">Message broker (Kafka / RabbitMQ) — asynchronous domain events</text>
  <text x="480" y="506" text-anchor="middle" fill="#92400e" font-size="11">OrderPlaced · OrderAccepted · PaymentAuthorized · DeliveryAssigned · OrderDelivered · OrderCancelled</text>

  <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#e)">
    <line x1="403" y1="420" x2="403" y2="468"/>
    <line x1="557" y1="420" x2="557" y2="468"/>
    <line x1="711" y1="420" x2="711" y2="468"/>
    <line x1="865" y1="468" x2="865" y2="296"/>
  </g>

  <!-- Legend -->
  <g font-size="11" transform="translate(40,540)">
    <rect x="0" y="0" width="16" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="22" y="10">★ implemented in this assignment</text>
    <rect x="230" y="0" width="16" height="12" fill="#f8fafc" stroke="#64748b"/>
    <text x="252" y="10">designed, not implemented</text>
    <line x1="430" y1="6" x2="470" y2="6" stroke="#15803d" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="476" y="10">synchronous REST/HTTP</text>
    <line x1="640" y1="6" x2="680" y2="6" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#e)"/>
    <text x="686" y="10">asynchronous event (future)</text>
  </g>
</svg>
