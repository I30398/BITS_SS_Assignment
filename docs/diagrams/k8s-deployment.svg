<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <title>Kubernetes deployment topology on Minikube - 2025MT03083 / Ajeet Kumar Yadav</title>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <rect x="20" y="14" width="200" height="48" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="120" y="35" text-anchor="middle" font-weight="600">Host / Postman / Browser</text>
  <text x="120" y="52" text-anchor="middle" fill="#64748b" font-size="11">http://&lt;minikube-ip&gt;:30001 / :30002</text>

  <rect x="20" y="80" width="860" height="375" rx="10" fill="#f8fafc" stroke="#326ce5" stroke-width="2"/>
  <text x="864" y="102" text-anchor="end" font-weight="600" fill="#326ce5">Minikube node (docker driver)</text>
  <rect x="40" y="114" width="820" height="325" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="54" y="134" fill="#64748b">namespace: foodexpress</text>

  <!-- Restaurant column -->
  <rect x="70" y="150" width="340" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="240" y="167" text-anchor="middle" font-weight="600">Service restaurant-service</text>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#3730a3">NodePort 30001 → 3001</text>
  <rect x="70" y="208" width="340" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="84" y="226" font-weight="600">Deployment restaurant-service (replicas 2, HPA 2–5)</text>
  <rect x="90" y="236" width="140" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="160" y="260" text-anchor="middle" font-size="11">Pod restaurant-service-xxx</text>
  <rect x="250" y="236" width="140" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="320" y="260" text-anchor="middle" font-size="11">Pod restaurant-service-yyy</text>
  <rect x="70" y="306" width="340" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="240" y="330" text-anchor="middle">Service restaurant-db (ClusterIP 5432)</text>
  <rect x="70" y="360" width="340" height="62" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="84" y="380" font-weight="600">Deployment restaurant-db (postgres:15)</text>
  <text x="84" y="398" font-size="11" fill="#475569">Secret restaurant-db-secret · PVC restaurant-db-pvc 1Gi</text>
  <text x="84" y="413" font-size="11" fill="#475569">ConfigMap restaurant-service-config</text>

  <!-- Order column -->
  <rect x="490" y="150" width="340" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="660" y="167" text-anchor="middle" font-weight="600">Service order-service</text>
  <text x="660" y="182" text-anchor="middle" font-size="11" fill="#3730a3">NodePort 30002 → 3002</text>
  <rect x="490" y="208" width="340" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="504" y="226" font-weight="600">Deployment order-service (replicas 2, HPA 2–5)</text>
  <rect x="510" y="236" width="140" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="580" y="260" text-anchor="middle" font-size="11">Pod order-service-xxx</text>
  <rect x="670" y="236" width="140" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="260" text-anchor="middle" font-size="11">Pod order-service-yyy</text>
  <rect x="490" y="306" width="340" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="660" y="330" text-anchor="middle">Service order-db (ClusterIP 5432)</text>
  <rect x="490" y="360" width="340" height="62" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="504" y="380" font-weight="600">Deployment order-db (postgres:15)</text>
  <text x="504" y="398" font-size="11" fill="#475569">Secret order-db-secret · PVC order-db-pvc 1Gi</text>
  <text x="504" y="413" font-size="11" fill="#475569">ConfigMap order-service-config</text>

  <g stroke="#334155" stroke-width="1.5" marker-end="url(#k)">
    <path d="M120,62 L120,100 L240,100 L240,148" fill="none"/>
    <path d="M120,62 L120,100 L660,100 L660,148" fill="none"/>
    <line x1="240" y1="190" x2="240" y2="206"/>
    <line x1="660" y1="190" x2="660" y2="206"/>
    <line x1="240" y1="288" x2="240" y2="304"/>
    <line x1="660" y1="288" x2="660" y2="304"/>
    <line x1="240" y1="346" x2="240" y2="358"/>
    <line x1="660" y1="346" x2="660" y2="358"/>
  </g>
  <path d="M490,248 C450,248 450,170 412,170" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#k)"/>
  <g fill="#15803d" font-size="10" font-weight="600" text-anchor="middle">
    <text x="450" y="300">REST via</text><text x="450" y="313">K8s DNS</text>
    <text x="450" y="326">restaurant-</text><text x="450" y="339">service:3001</text>
  </g>
</svg>
