# Run the Restaurant Service standalone (independent dev/test) - 2025MT03083 / Ajeet Kumar Yadav
services:
  restaurant-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_pass
      POSTGRES_DB: restaurant_db
    ports:
      - "5433:5432"

  restaurant-service:
    build: .
    image: restaurant-service:1.0
    environment:
      PORT: 3001
      DB_HOST: restaurant-db
      DB_USER: restaurant_user
      DB_PASSWORD: restaurant_pass
      DB_NAME: restaurant_db
    ports:
      - "3001:3001"
    depends_on:
      - restaurant-db
